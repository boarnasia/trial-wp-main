[project]
name = "wp-main"
version = "0.1.0"
description = "wp-main: マルチリポジトリ WordPress 開発環境の管理 CLI"
authors = [
    { name = "Masato Uehara", email = "masato.uehara.1975@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.1",
    "django-typer>=4.1.0",
    "gunicorn>=26.2.0",
    "typer>=0.27.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
cli = "wp_main.cli.legacy:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "wp_main.settings"

