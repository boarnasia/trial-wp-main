[project]
name = "wp-main"
version = "0.1.0"
description = "wp-main: マルチリポジトリ WordPress 開発環境の管理 CLI"
authors = [
    { name = "Masato Uehara", email = "masato.uehara.1975@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
cli = "wp_main.cli:app"

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "wp-main[dashboard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
wp-main = { workspace = true }
