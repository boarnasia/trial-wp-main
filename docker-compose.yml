# 一括起動: Caddy と wp-wp1 / wp-wp2 の全サービスを 1 プロジェクトとして起動する
# 各サイトの .env は include 先のディレクトリから読み込まれる
name: wp-main

include:
  - ../wp-wp1/docker-compose.yml
  - ../wp-wp2/docker-compose.yml

services:
  caddy:
    image: caddy:2
    container_name: wp-caddy
    restart: unless-stopped
    # 既定はループバックだけ。LAN に公開するときは PROXY_BIND_ADDRESS=0.0.0.0 を .env か実行時に指定する
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    environment:
      WP1_DOMAIN: ${WP1_DOMAIN}
      WP2_DOMAIN: ${WP2_DOMAIN}
      # 既存の .env は上書きされないため、DASHBOARD_DOMAIN がない環境でも動くよう既定値を持たせる
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-local.wp-main.yamashita109.com}
      # ダッシュボードはホストで devenv serve が動かす。ポートは devenv serve と同じ .env の値を使う
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8000}
    # Docker Desktop 以外のエンジンでも host.docker.internal をホストに向ける
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wp-global-net

networks:
  wp-global-net:
    external: true

volumes:
  # 内部 CA の鍵を保持し、down/up でキーチェーンの信頼登録が無効にならないようにする
  caddy_data:
    name: wp-caddy-data
  caddy_config:
    name: wp-caddy-config
