{# パスワード欄: 値は HTML に含めず、表示・コピーのときだけ url から取得する #}
{% if has_password %}
<span class="grow font-mono tracking-wider" data-secret="{{ key }}">••••••••••</span>
<button type="button" class="icon-button" data-secret-toggle="{{ key }}" data-secret-url="{{ url }}" data-label="{{ label }}" aria-pressed="false" aria-label="{{ label }}を表示">{% include "icons/eye.html" %}</button>
<button type="button" class="icon-button" data-secret-copy="{{ key }}" data-secret-url="{{ url }}" data-label="{{ label }}" aria-label="{{ label }}をコピー">{% include "icons/copy.html" %}</button>
{% else %}
<span class="grow text-muted">未設定</span>
<button type="button" class="icon-button" disabled aria-label="{{ label }}は未設定">{% include "icons/eye.html" %}</button>
<button type="button" class="icon-button" disabled aria-label="{{ label }}は未設定">{% include "icons/copy.html" %}</button>
{% endif %}
